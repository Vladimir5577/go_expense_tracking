services:
  expenses_service:
    build:
      context: .
      dockerfile: ./docker_env/go/Dockerfile
    container_name: expenses_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env задаёт 127.0.0.1 — внутри контейнера это только его loopback.
      - SERVER_HOST=0.0.0.0
    volumes:
      - ./:/app
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
