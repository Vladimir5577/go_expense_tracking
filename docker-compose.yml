services:
  expenses_service:
    build:
      context: .
      dockerfile: ./docker_env/go/Dockerfile
    container_name: expenses_service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Прокидываем текущую папку с бинарником main, статикой и SQLite-базой.
      - ./:/app
    environment:
      # Перекрывает .env: петля у контейнера своя, и с 127.0.0.1 внутри
      # сервис был бы недоступен даже для nginx.
      - SERVER_HOST=0.0.0.0
    ports:
      # Префикс 127.0.0.1 обязателен: без него Docker пробивает порт
      # наружу в обход ufw.
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - expenses-net

networks:
  expenses-net:
    name: expenses-net
    driver: bridge
